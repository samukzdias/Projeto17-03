<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Central</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .portal-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.03em;
        }

        .header-nav {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-item {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 4rem 2rem;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 4rem;
            align-items: start;
        }

        .hero-section {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .hero-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            line-height: 1.1;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: 1.3rem;
            color: #94a3b8;
            line-height: 1.6;
            max-width: 600px;
        }

        /* SIDEBAR - CALCULADORA SECTION */
        .sidebar {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 2.5rem;
            height: fit-content;
            position: sticky;
            top: 120px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* ESPAÇO RESERVADO PARA BOTÃO DA CALCULADORA */
        .calculator-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .calculator-card:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.5);
        }

        .calculator-placeholder {
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(59, 130, 246, 0.1);
            border: 2px dashed #475569;
            border-radius: 12px;
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .calculator-placeholder:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: #60a5fa;
            color: #bfdbfe;
        }

        /* FOOTER */
        .footer {
            background: #0f0f23;
            border-top: 1px solid #1e293b;
            padding: 2rem;
            text-align: center;
            color: #64748b;
        }

        /* RESPONSIVO */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 2rem;
                padding: 2rem;
            }
            
            .sidebar {
                order: -1;
                position: static;
            }
        }

        @media (max-width: 768px) {
            .header-nav {
                display: none;
            }
            
            .main-content {
                padding: 1.5rem;
            }
        }

        /* EFEITOS GLOBAIS */
        ::selection {
            background: #3b82f6;
            color: white;
        }

        /* SCROLLBAR CUSTOM */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f0f23;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        
    </style>
</head>
<body>
    <div class="portal-container" >
        <!-- HEADER -->
       <header class="header">
  <div class="header-content">
    <div class="logo">PORTAL DOS CALCULOS</div>
  </div>
</header>

<style>
  .header-content {
    display: flex;
    justify-content: center;
    padding: 20px; 
  }
  
  .logo {
    font-weight: bold;
    font-size: 24px;
    
  }
</style>


        <!-- MAIN -->
        <main class="main-content">
            <!-- CONTEÚDO PRINCIPAL -->
            <div class="hero-section">
                <h1 class="hero-title">Portal dos Calculos</h1>
                <p class="hero-subtitle">
                    Gerencie suas operações com eficiência máxima. Interface moderna, 
                    performance otimizada e design focado na produtividade.
                </p>
            </div>

            <!-- SIDEBAR COM CALCULADORA -->
            <aside class="sidebar">
                <h2 class="section-title">🧮 Ferramentas Rápidas</h2>
                
                <!-- ESPAÇO VAZIO PARA BOTÃO DA CALCULADORA -->
                <div class="calculator-card">
                    <div class="calculator-placeholder"></div>
                </div>
            </aside>
        </main>

        <!-- FOOTER -->
        <footer class="footer">
            <p>&copy; 2026 Portal dos Calculos. Todos os direitos reservados.
                <br>
               E.E Fausto Cardoso Figueira de Mello
            <br>
            3ºB
            </p>
        </footer>
    </div>
</body>
</html>
